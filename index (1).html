<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Louise &amp; Alpcan – Engagement party</title>
<meta name="description" content="You’re invited to our engagement party. Saturday 5 December, 7pm, The Wheatsheaf, Tooting Bec.">
<meta property="og:title" content="Louise &amp; Alpcan – Engagement party">
<meta property="og:description" content="Saturday 5 December, 7pm, The Wheatsheaf, Tooting Bec. Kindly reply by 15 November.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://alpcankrmn.github.io/invite/invite.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#3482B3; --bg2:#81B9D4; --bg3:#D9D2C0; --onpage:#1E4A2B;
  --green:#1E4A2B; --paper:#FBF8F0; --sand:#BCAA7A; --sky:#3482B3;
  --line:rgba(30,74,43,.38); --muted:#4F6B58; --err:#8F2D1F;
  --script:"Pinyon Script","Snell Roundhand","Apple Chancery",cursive;
  --serif:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg1:#12304A; --bg2:#1B4666; --bg3:#26323A; --onpage:#E9E2D0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{ --bg1:#12304A; --bg2:#1B4666; --bg3:#26323A; --onpage:#E9E2D0; color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);min-height:100%}
body{margin:0;min-height:100vh;font-family:var(--serif);font-weight:500;font-size:20px;line-height:1.35;color:var(--green);-webkit-text-size-adjust:100%;
  background:linear-gradient(180deg,var(--bg1) 0,var(--bg2) 780px,var(--bg3) 1300px) no-repeat var(--bg3)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg1);z-index:10}
main{max-width:540px;margin:0 auto;padding:16px 16px 44px}
.poster{display:block;width:100%;height:auto;border-radius:6px;background:var(--bg2);box-shadow:0 14px 34px rgba(8,28,48,.35)}
.card{position:relative;margin-top:22px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:34px 24px 30px;text-align:center;
  box-shadow:inset 0 0 0 7px var(--paper),inset 0 0 0 8px var(--line),0 14px 34px rgba(8,28,48,.28)}
.script{font-family:var(--script);font-weight:400;font-size:clamp(42px,12.5vw,56px);line-height:1.05;margin:0 0 10px;color:var(--green)}
.when{margin:0;font-size:24px;font-weight:600;letter-spacing:.02em}
.where{margin:2px 0 0;font-size:21px}
.where a{color:var(--green);text-underline-offset:4px;text-decoration-thickness:1px}
.by{margin:10px 0 0;font-style:italic;font-size:20px;color:var(--muted)}
.count{margin:4px 0 0;font-style:italic;font-size:19px;color:var(--muted)}
.orn{display:flex;align-items:center;gap:12px;margin:24px auto 22px;max-width:260px}
.orn::before,.orn::after{content:"";flex:1;border-top:1px solid var(--sand)}
.orn i{width:9px;height:9px;border:1px solid var(--sand);transform:rotate(45deg);flex:none}
form{text-align:left}
.field{border:0;margin:0 0 24px;padding:0;min-width:0}
label.t,legend{display:block;padding:0;font-style:italic;font-size:21px;margin-bottom:6px;color:var(--green)}
input[type=text]{width:100%;font:inherit;font-weight:600;font-size:25px;color:var(--green);background:transparent;border:0;border-bottom:1px solid var(--green);border-radius:0;padding:6px 2px 7px;-webkit-appearance:none;appearance:none}
input[type=text]:focus{outline:none;border-bottom:2px solid var(--sky);padding-bottom:6px}
.choices{display:grid;gap:10px}
.nums{display:flex;gap:10px;flex-wrap:wrap}
.pick{position:relative;display:block;cursor:pointer}
.pick input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pick span{display:block;text-align:center;border:1px solid var(--green);border-radius:4px;padding:13px 14px;font-size:22px;font-weight:600;line-height:1.15;background:transparent;transition:background .15s,color .15s}
.nums .pick span{width:52px;height:52px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:24px}
.pick:hover span{background:rgba(30,74,43,.07)}
.pick input:checked + span{background:var(--green);color:var(--paper)}
.pick input:focus-visible + span{outline:3px solid var(--sky);outline-offset:3px}
.err{min-height:24px;margin:-6px 0 8px;font-size:19px;font-weight:600;color:var(--err)}
.err a{color:var(--err)}
.send{display:block;width:100%;border:0;border-radius:4px;background:var(--green);color:var(--paper);font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:.14em;text-transform:uppercase;padding:16px 18px;cursor:pointer}
.send:hover:not(:disabled){filter:brightness(1.15)}
.send:disabled{opacity:.65;cursor:default}
.send:focus-visible,.again:focus-visible,.where a:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.thanks{text-align:center}
.thanks p{margin:0 0 8px;font-size:22px}
.thanks .script{margin-bottom:12px}
.again{margin-top:14px;background:none;border:0;font:inherit;font-style:italic;font-size:19px;color:var(--muted);text-decoration:underline;text-underline-offset:4px;cursor:pointer}
.foot{margin:22px 0 0;text-align:center;font-style:italic;font-size:19px;color:var(--onpage)}
.banner{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));margin:0 auto;width:max-content;max-width:92%;background:#14213D;color:#fff;font-family:system-ui,sans-serif;font-size:14px;padding:8px 14px;border-radius:99px;z-index:20;text-align:center}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
</style>
</head>
<body>
<main>
  <img class="poster" src="invite.jpg" width="1135" height="1600" alt="Engagement party invitation for Louise and Alpcan. Saturday 5 December, 7pm, The Wheatsheaf, Tooting Bec. An illustrated painting of the couple smiling in sun hats in front of ancient ruins.">

  <section class="card" aria-labelledby="h">
    <div id="ask">
      <h2 class="script" id="h">Will you join us?</h2>
      <p class="when">Saturday 5 December · 7pm</p>
      <p class="where">The Wheatsheaf, Tooting Bec · <a id="map" href="#" target="_blank" rel="noopener noreferrer">Open in Maps</a></p>
      <p class="by">Kindly reply by 15 November</p>
      <p class="count" id="count" hidden></p>

      <div class="orn" aria-hidden="true"><i></i></div>

      <form id="rsvp" novalidate>
        <div class="field">
          <label class="t" for="name">Your name</label>
          <input id="name" type="text" autocomplete="name" autocapitalize="words" maxlength="80">
        </div>

        <fieldset class="field">
          <legend>Will you be joining us?</legend>
          <div class="choices">
            <label class="pick"><input type="radio" name="attend" value="Yes"><span>Yes, we’d love to</span></label>
            <label class="pick"><input type="radio" name="attend" value="Maybe"><span>Not sure yet</span></label>
            <label class="pick"><input type="radio" name="attend" value="No"><span>Sadly, we can’t make it</span></label>
          </div>
        </fieldset>

        <fieldset class="field" id="guestsField" hidden>
          <legend>How many of you, including yourself?</legend>
          <div class="nums">
            <label class="pick"><input type="radio" name="guests" value="1"><span>1</span></label>
            <label class="pick"><input type="radio" name="guests" value="2"><span>2</span></label>
            <label class="pick"><input type="radio" name="guests" value="3"><span>3</span></label>
            <label class="pick"><input type="radio" name="guests" value="4"><span>4</span></label>
            <label class="pick"><input type="radio" name="guests" value="5"><span>5</span></label>
          </div>
        </fieldset>

        <p class="err" id="err" role="alert" aria-live="polite"></p>
        <button class="send" id="send" type="submit">Send reply</button>
      </form>
    </div>

    <div class="thanks" id="thanks" hidden>
      <h2 class="script" id="tHead">Thank you</h2>
      <p id="tMsg"></p>
      <p id="tSub"></p>
      <button class="again" id="again" type="button">Change my reply</button>
    </div>
  </section>

  <p class="foot">Louise &amp; Alpcan · 5 December 2026</p>
</main>
<p class="banner" id="banner" hidden>Design preview · replies are not sent</p>

<script>
"use strict";
/* ==== Settings ==== */
const CONFIG = {
  formId:       "1FAIpQLScMDosPLwdgLspombBqZHcP1DfR2I8sclBRFACsTSCaqi4fVQ",
  entryName:    "entry.512761361",
  entryAttend:  "entry.464477277",
  entryGuests:  "entry.283507777",
  fallback:     "https://forms.gle/drKuUqdWAVLrBWJF7",
  map:          "The Wheatsheaf Tooting Bec London",
  year: 2026, month: 12, day: 5,
  guestsRequired: true,   /* true because the Google Form asks for the number of guests on every reply. Set to false if you switch "Required" off for that question */
  preview:      false
};
/* ================== */

const $ = id => document.getElementById(id);
$("map").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(CONFIG.map);
if (CONFIG.preview) $("banner").hidden = false;

(function countdown(){
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const n = Math.round((new Date(CONFIG.year, CONFIG.month - 1, CONFIG.day) - today) / 86400000);
  if (n < 0) return;
  $("count").textContent = n === 0 ? "It’s today!" : n + (n === 1 ? " day" : " days") + " to go";
  $("count").hidden = false;
})();

const form = $("rsvp"), err = $("err"), send = $("send");
const val = n => { const r = form.querySelector('input[name="' + n + '"]:checked'); return r ? r.value : ""; };
form.addEventListener("change", () => {
  $("guestsField").hidden = val("attend") === "No" || !val("attend");
  err.textContent = "";
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  err.textContent = "";
  const name = $("name").value.trim(), attend = val("attend"), guests = val("guests");
  if (!name) { err.textContent = "Please tell us your name."; $("name").focus(); return; }
  if (!attend) { err.textContent = "Please let us know if you can come."; return; }
  if (attend !== "No" && !guests) { err.textContent = "Please tell us how many of you are coming."; return; }
  const connected = CONFIG.entryName && CONFIG.entryAttend && CONFIG.entryGuests;
  if (!CONFIG.preview && !connected) {
    err.innerHTML = 'This form isn’t connected yet. <a href="' + CONFIG.fallback + '" target="_blank" rel="noopener noreferrer">Please reply here</a>.';
    return;
  }
  send.disabled = true; send.textContent = "Sending…";
  try {
    if (CONFIG.preview) {
      await new Promise(r => setTimeout(r, 700));
    } else {
      const body = new URLSearchParams();
      body.append(CONFIG.entryName, name);
      body.append(CONFIG.entryAttend, attend);
      if (attend !== "No") body.append(CONFIG.entryGuests, guests);
      else if (CONFIG.guestsRequired) body.append(CONFIG.entryGuests, "1");
      await fetch("https://docs.google.com/forms/d/e/" + CONFIG.formId + "/formResponse", {
        method: "POST", mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
      });
    }
    const first = name.split(/\s+/)[0];
    $("tHead").textContent = "Thank you, " + first;
    if (attend === "Yes") {
      $("tMsg").textContent = "We can’t wait to celebrate with you.";
      $("tSub").textContent = "Saturday 5 December, 7pm, The Wheatsheaf, Tooting Bec.";
    } else if (attend === "Maybe") {
      $("tMsg").textContent = "We hope you can make it.";
      $("tSub").textContent = "Just send us a new reply any time before 15 November.";
    } else {
      $("tMsg").textContent = "We’ll miss you, and thank you for letting us know.";
      $("tSub").textContent = "";
    }
    $("ask").hidden = true; $("thanks").hidden = false;
    $("thanks").scrollIntoView({ block: "center", behavior: "smooth" });
  } catch (x) {
    err.innerHTML = 'Sorry, that didn’t send. Please try again, or <a href="' + CONFIG.fallback + '" target="_blank" rel="noopener noreferrer">reply with the original form</a>.';
  }
  send.disabled = false; send.textContent = "Send reply";
});
$("again").addEventListener("click", () => { $("thanks").hidden = true; $("ask").hidden = false; $("name").focus(); });
</script>
</body>
</html>
